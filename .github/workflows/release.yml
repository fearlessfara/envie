name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # One universal binary rather than two, so the formula needs no
          # architecture split on macOS.
          - runner: macos-latest
            name: darwin-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Statically linked against musl, so the binary does not depend on the
          # glibc version of whatever distribution it lands on.
          - runner: ubuntu-latest
            name: linux-x86_64
            targets: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            name: linux-aarch64
            targets: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install musl toolchain
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          set -euo pipefail
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked --target "$target"
          done
        env:
          TARGETS: ${{ matrix.targets }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="envie-${VERSION}-${{ matrix.name }}.tar.gz"

          if [ "${{ matrix.name }}" = "darwin-universal" ]; then
            lipo -create \
              target/aarch64-apple-darwin/release/envie \
              target/x86_64-apple-darwin/release/envie \
              -output envie
          else
            cp "target/${{ matrix.targets }}/release/envie" envie
          fi

          tar czf "${TARBALL}" envie
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        id: sums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd artifacts
          sha256sum *.tar.gz | tee ../SHA256SUMS
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          for name in darwin-universal linux-x86_64 linux-aarch64; do
            sum="$(sha256sum "envie-${VERSION}-${name}.tar.gz" | awk '{print $1}')"
            echo "${name//-/_}=${sum}" >> "${GITHUB_OUTPUT}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            SHA256SUMS
          generate_release_notes: true

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: fearlessfara/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_DARWIN: ${{ steps.sums.outputs.darwin_universal }}
          SHA_LINUX_X86_64: ${{ steps.sums.outputs.linux_x86_64 }}
          SHA_LINUX_AARCH64: ${{ steps.sums.outputs.linux_aarch64 }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os

          version = os.environ["VERSION"]
          base = f"https://github.com/fearlessfara/envie/releases/download/v{version}"
          Path("Formula").mkdir(exist_ok=True)
          Path("Formula/envie.rb").write_text(
              f'''class Envie < Formula
            desc "Run many environments from one Terraform codebase"
            homepage "https://github.com/fearlessfara/envie"
            version "{version}"
            license "MIT"

            on_macos do
              url "{base}/envie-{version}-darwin-universal.tar.gz"
              sha256 "{os.environ["SHA_DARWIN"]}"
            end

            on_linux do
              on_intel do
                url "{base}/envie-{version}-linux-x86_64.tar.gz"
                sha256 "{os.environ["SHA_LINUX_X86_64"]}"
              end
              on_arm do
                url "{base}/envie-{version}-linux-aarch64.tar.gz"
                sha256 "{os.environ["SHA_LINUX_AARCH64"]}"
              end
            end

            def install
              bin.install "envie"
            end

            test do
              assert_match "envie", shell_output("#{{bin}}/envie --version")
            end
          end
          '''
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/envie.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "envie ${VERSION}"
          git push

      - name: Skip tap update
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipped updating fearlessfara/homebrew-tap"
