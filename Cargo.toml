[package]
name = "envie"
version = "0.2.1"
edition = "2021"
description = "Run many environments from one Terraform codebase, including repositories Envie did not create"
authors = ["Christian Gennaro Faraone"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/fearlessfara/envie"
homepage = "https://github.com/fearlessfara/envie"
keywords = ["terraform", "infrastructure", "environments", "devops", "iac"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "envie"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive", "color"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# File system operations
walkdir = "2.4"

# Terminal colors and formatting
colored = "2.0"

# Regular expressions
regex = "1.10"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Reading Terraform configuration
hcl-rs = "0.19.8"

[dev-dependencies]
tempfile = "3.8"
