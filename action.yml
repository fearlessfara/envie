name: Setup Envie
description: Install envie from GitHub Releases and optionally run a command
author: fearlessfara
branding:
  icon: layers
  color: blue

inputs:
  version:
    description: >
      Envie version to install (`0.2.1`, `v0.2.1`, or `latest`). When omitted,
      the version is taken from the action ref (`fearlessfara/envie@v0.2.1`);
      otherwise `latest`.
    required: false
    default: ""
  command:
    description: >
      Envie subcommand to run after install (`deploy`, `destroy`, `delete`,
      `list`, `show`, …). Leave empty to install only.
    required: false
    default: ""
  env:
    description: Environment id (`--env`). Required for `deploy` and `delete`.
    required: false
    default: ""
  unit:
    description: Limit the command to one unit (`--unit`).
    required: false
    default: ""
  dry-run:
    description: Pass `--dry-run` (plan only, no apply).
    required: false
    default: "false"
  no-prompt:
    description: >
      Pass `--no-prompt` for `deploy`, `destroy`, `delete`, and `init`.
      Defaults to true so Actions do not hang on stdin.
    required: false
    default: "true"
  override:
    description: >
      Dependency redirects, one `unit:environment` per line
      (passed as `-E`).
    required: false
    default: ""
  working-directory:
    description: Directory to run the command from (project or unit root).
    required: false
    default: ""
  args:
    description: >
      Escape hatch: raw arguments after `envie` (for example
      `--version` or `list --json`). Cannot be combined with `command`.
    required: false
    default: ""
  token:
    description: GitHub token used to resolve `latest` and download release assets
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install envie
      id: install
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        GITHUB_TOKEN: ${{ inputs.token }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        raw="${VERSION_INPUT}"
        if [ -z "${raw}" ]; then
          case "${ACTION_REF}" in
            v[0-9]*|[0-9]*.[0-9]*) raw="${ACTION_REF}" ;;
            *) raw="latest" ;;
          esac
        fi

        curl_auth() {
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "User-Agent: fearlessfara-envie-action" \
              "$@"
          else
            curl -fsSL -H "User-Agent: fearlessfara-envie-action" "$@"
          fi
        }

        if [ "${raw}" = "latest" ]; then
          json="$(curl_auth \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fearlessfara/envie/releases/latest)"
          if command -v jq >/dev/null 2>&1; then
            tag="$(printf '%s' "${json}" | jq -r .tag_name)"
          else
            tag="$(printf '%s' "${json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          fi
        else
          tag="${raw}"
          case "${tag}" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
        fi

        version="${tag#v}"
        if [ -z "${version}" ] || [ "${version}" = "null" ]; then
          echo "::error::Could not resolve an Envie version from '${raw}'"
          exit 1
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) asset="linux-x86_64" ;;
          Linux-ARM64) asset="linux-aarch64" ;;
          macOS-X64|macOS-ARM64) asset="darwin-universal" ;;
          *)
            echo "::error::Unsupported runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        tarball="envie-${version}-${asset}.tar.gz"
        base="https://github.com/fearlessfara/envie/releases/download/${tag}"
        work="${RUNNER_TEMP}/envie-install"
        bin_dir="${RUNNER_TEMP}/envie-bin"
        mkdir -p "${work}" "${bin_dir}"

        echo "Installing envie ${tag} (${tarball})"
        curl_auth -o "${work}/${tarball}" "${base}/${tarball}"
        curl_auth -o "${work}/SHA256SUMS" "${base}/SHA256SUMS"

        expected="$(awk -v f="${tarball}" '$2 == f { print $1; exit }' "${work}/SHA256SUMS")"
        if [ -z "${expected}" ]; then
          echo "::error::No checksum for ${tarball} in SHA256SUMS"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "${work}" && printf '%s  %s\n' "${expected}" "${tarball}" | sha256sum -c -)
        else
          actual="$(shasum -a 256 "${work}/${tarball}" | awk '{ print $1 }')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Checksum mismatch for ${tarball}"
            exit 1
          fi
        fi

        tar -xzf "${work}/${tarball}" -C "${bin_dir}"
        chmod +x "${bin_dir}/envie"
        echo "${bin_dir}" >> "${GITHUB_PATH}"

        "${bin_dir}/envie" --version

    - name: Run envie
      if: inputs.command != '' || inputs.args != ''
      shell: bash
      env:
        ENVIE_COMMAND: ${{ inputs.command }}
        ENVIE_ENV: ${{ inputs.env }}
        ENVIE_UNIT: ${{ inputs.unit }}
        ENVIE_DRY_RUN: ${{ inputs.dry-run }}
        ENVIE_NO_PROMPT: ${{ inputs.no-prompt }}
        ENVIE_OVERRIDE: ${{ inputs.override }}
        ENVIE_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ENVIE_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        if [ -n "${ENVIE_COMMAND}" ] && [ -n "${ENVIE_ARGS}" ]; then
          echo "::error::Set either 'command' or 'args', not both"
          exit 1
        fi

        if [ -n "${ENVIE_WORKING_DIRECTORY}" ]; then
          cd "${ENVIE_WORKING_DIRECTORY}"
        fi

        if [ -n "${ENVIE_ARGS}" ]; then
          eval "envie ${ENVIE_ARGS}"
          exit 0
        fi

        case "${ENVIE_COMMAND}" in
          adopt|init|deploy|destroy|delete|generate|list|output|clean|show) ;;
          *)
            echo "::error::Unknown command '${ENVIE_COMMAND}'"
            exit 1
            ;;
        esac

        case "${ENVIE_COMMAND}" in
          deploy|delete)
            if [ -z "${ENVIE_ENV}" ]; then
              echo "::error::'env' is required for ${ENVIE_COMMAND}"
              exit 1
            fi
            ;;
        esac

        set -- "${ENVIE_COMMAND}"
        if [ -n "${ENVIE_ENV}" ]; then
          set -- "$@" --env "${ENVIE_ENV}"
        fi
        if [ -n "${ENVIE_UNIT}" ]; then
          set -- "$@" --unit "${ENVIE_UNIT}"
        fi
        if [ "${ENVIE_DRY_RUN}" = "true" ]; then
          set -- "$@" --dry-run
        fi
        case "${ENVIE_COMMAND}" in
          deploy|destroy|delete|init)
            if [ "${ENVIE_NO_PROMPT}" != "false" ]; then
              set -- "$@" --no-prompt
            fi
            ;;
        esac
        if [ -n "${ENVIE_OVERRIDE}" ]; then
          while IFS= read -r line || [ -n "${line}" ]; do
            # trim leading/trailing whitespace
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "${line}" ] && continue
            set -- "$@" -E "${line}"
          done <<EOF
        ${ENVIE_OVERRIDE}
        EOF
        fi

        envie "$@"
